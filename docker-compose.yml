version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock_api_key}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.5-flash}
      - DATABASE_URL=sqlite:///./regpulse.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - backend_data:/workspace

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
